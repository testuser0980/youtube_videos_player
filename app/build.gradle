plugins { id 'com.android.application' }

android {
    namespace 'com.imran.ytplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imran.ytplayer'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        multiDexEnabled true
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.3'

    // Media3 ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // YouTube API
    implementation 'com.google.http-client:google-http-client-gson:1.44.1'
    implementation('com.google.apis:google-api-services-youtube:v3-rev20240814-2.0.0') {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation('com.google.api-client:google-api-client-android:2.4.0') {
        exclude group: 'org.apache.httpcomponents'
    }

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    // Multidex
    implementation 'androidx.multidex:multidex:2.0.1'
}
